# Edge gateway: plays the role of BookMyShow's Cloudflare/CDN edge. It routes
# /api/* by prefix to the owning microservice, caches static payloads and
# artwork, rate-limits sensitive endpoints and serves the SSR web app.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    gzip          on;
    gzip_types    application/json image/svg+xml text/css application/javascript;
    server_tokens off;

    log_format edge '$remote_addr "$request" $status $body_bytes_sent ${request_time}s cache=$upstream_cache_status up=$upstream_addr';
    access_log /dev/stdout edge;

    proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:20m max_size=256m inactive=1d use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=otp:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=trans:10m rate=10r/s;

    upstream catalog   { server catalog:8081; }
    upstream showtimes { server showtimes:8082; }
    upstream trans     { server trans:8083; }
    upstream user      { server user:8084; }
    upstream web       { server web:3000; }


    server {
        listen 80;
        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Edge-Cache $upstream_cache_status always;

        # Cacheable reads: honour upstream Cache-Control, serve stale on error.
        proxy_cache            edge;
        proxy_cache_bypass     $http_x_bypass_cache;
        proxy_no_cache         $http_x_bypass_cache;
        proxy_cache_use_stale  error timeout updating http_502 http_503;
        proxy_cache_lock       on;

        location /api/img/                 { proxy_pass http://catalog; }
        location /api/regions              { proxy_pass http://catalog; }
        location /api/explore/             { proxy_cache off; proxy_pass http://catalog; }
        location /api/movies/              { proxy_pass http://catalog; }
        location /api/events/              { proxy_pass http://catalog; }
        location /api/search/              { proxy_cache off; proxy_pass http://catalog; }
        location /api/clickstream/         { proxy_cache off; proxy_pass http://catalog; }

        location /api/movies-data/         { proxy_pass http://showtimes; }

        location /api/trans/ {
            proxy_cache off;
            limit_req zone=trans burst=30 nodelay;
            proxy_pass http://trans;
        }

        location = /api/user/v1/otp {
            proxy_cache off;
            limit_req zone=otp burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://user;
        }
        location /api/user/                { proxy_cache off; proxy_pass http://user; }

        location /assets/ {
            proxy_cache edge;
            proxy_cache_valid 200 30d;
            proxy_pass http://web;
        }

        location / {
            proxy_cache off;
            proxy_pass http://web;
        }
    }
}
